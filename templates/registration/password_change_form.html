{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block titulo %}Cambiar contraseña — Edumia{% endblock %}
{% block titulo_topbar %}Cambiar contraseña{% endblock %}

{% block contenido %}
<div class="card card-edumia p-4" style="max-width: 480px;">
  <h1 class="h4 mb-3">Cambiar contraseña</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-edumia-primary w-100 mt-2">Guardar</button>
  </form>
</div>
{% endblock %}
